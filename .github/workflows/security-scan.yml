# ============================================================
# Scheduled Security Scan — weekly OWASP Dependency Check
#
# CVEs are published daily, so even with zero code changes the
# dependency tree can become vulnerable. This weekly run catches
# that; failures automatically open a GitHub issue.
#
# Reuses dependency-check.yml — no duplicated scan logic.
# ============================================================
name: Security Scan (Scheduled)

on:
  schedule:
    - cron: "0 2 * * 0"   # Every Sunday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  owasp:
    name: OWASP Dependency Check
    uses: ./.github/workflows/dependency-check.yml
    secrets: inherit

  report-failure:
    name: Open issue on failure
    runs-on: ubuntu-latest
    needs: [owasp]
    if: always() && needs.owasp.result == 'failure'
    steps:
      - name: Create GitHub issue
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ OWASP Dependency Check failed — ' + new Date().toISOString().slice(0, 10),
              body: [
                'The scheduled OWASP Dependency Check detected vulnerabilities with CVSS ≥ 7.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Please review the uploaded artifact and update the affected dependencies.',
              ].join('\n'),
              labels: ['security', 'dependencies'],
            });
