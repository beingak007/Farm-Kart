# ============================================================
# Farm Kart Microservices — CI Pipeline
# Triggers: push to main/develop/release/hotfix, all PRs,
#           manual dispatch (workflow_dispatch)
# Java 21 | Maven | JaCoCo | SonarCloud | OWASP
# ============================================================

name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      skip_owasp:
        description: "Skip OWASP security scan"
        required: false
        default: "false"
        type: boolean

# Cancel in-progress runs for the same ref to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: "temurin"
  MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"

# ─────────────────────────────────────────────────────────────
# Shared permissions for all jobs
# ─────────────────────────────────────────────────────────────
permissions:
  contents: read
  checks: write         # required by dorny/test-reporter
  pull-requests: write  # required for PR comments/annotations

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1 — Build + Unit Tests + JaCoCo
  # ──────────────────────────────────────────────────────────
  build-and-test:
    name: "Build & Test (Java ${{ env.JAVA_VERSION }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      build_status: ${{ steps.set-status.outputs.status }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history for SonarCloud

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Show Java & Maven versions
        run: |
          java -version
          mvn --version

      - name: Compile all modules
        run: mvn clean package -DskipTests --batch-mode --no-transfer-progress

      - name: Run unit tests with JaCoCo
        id: tests
        run: mvn verify --batch-mode --no-transfer-progress -Djacoco.haltOnFailure=false
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Set build status output
        id: set-status
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" == "success" ]; then
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Upload JaCoCo HTML reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-html
          path: "**/target/site/jacoco/"
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Surefire test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7
          if-no-files-found: warn

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Test Results
          path: "**/target/surefire-reports/*.xml"
          reporter: java-junit
          fail-on-error: false

  # ──────────────────────────────────────────────────────────
  # Job 2 — SonarCloud Analysis
  # Runs after tests so JaCoCo coverage is available
  # ──────────────────────────────────────────────────────────
  # ──────────────────────────────────────────────────────────
  # Job 2 — Code Quality (Checkstyle + SpotBugs + PMD)
  # NOTE: SonarCloud removed — will be added in a future phase
  # ──────────────────────────────────────────────────────────
  code-quality:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run quality checks (Checkstyle / SpotBugs / PMD)
        run: |
          if mvn help:all-profiles --batch-mode --no-transfer-progress 2>/dev/null | grep -q 'quality'; then
            mvn verify -P quality --batch-mode --no-transfer-progress -DskipTests
          else
            echo "::warning::Maven 'quality' profile not found — skipping static analysis"
          fi
        continue-on-error: true

      - name: Upload SpotBugs reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-reports
          path: "**/target/spotbugsXml.xml"
          retention-days: 14
          if-no-files-found: warn

      - name: Upload PMD reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmd-reports
          path: "**/target/pmd.xml"
          retention-days: 14
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────
  # Job 4 — OWASP Dependency Check (push to main only)
  # ──────────────────────────────────────────────────────────
  security-scan:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build-and-test
    if: |
      github.event.inputs.skip_owasp != 'true' && (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run OWASP Dependency Check
        run: |
          if mvn help:all-profiles --batch-mode --no-transfer-progress 2>/dev/null | grep -q 'security-scan'; then
            mvn verify -P security-scan --batch-mode --no-transfer-progress -DskipTests
          else
            echo "::warning::Maven 'security-scan' profile not found — skipping OWASP scan"
          fi
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: "**/target/dependency-check/**"
          retention-days: 30
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────
  # Job 5 — Publish Artifacts (push to main only)
  # ──────────────────────────────────────────────────────────
  publish-artifacts:
    name: Publish Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-and-test, code-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build & package (production)
        run: |
          mvn clean package \
            --batch-mode \
            --no-transfer-progress \
            -DskipTests \
            -Drevision=${{ github.sha }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: farm-kart-artifacts-${{ github.sha }}
          path: |
            **/target/*.jar
            !**/target/original-*.jar
          retention-days: 30
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────
  # Job 5 — CI Status Summary (always runs, visible on PR)
  # ──────────────────────────────────────────────────────────
  ci-status:
    name: "CI Status Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - build-and-test
      - code-quality

    steps:
      - name: Print CI summary
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test  | ${{ needs.build-and-test.result == 'success' && '✅ Passed' || needs.build-and-test.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality  | ${{ needs.code-quality.result == 'success' && '✅ Passed' || needs.code-quality.result == 'skipped' && '⏭️ Skipped' || '⚠️ Check logs' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP Scan    | main push only |" >> $GITHUB_STEP_SUMMARY
          echo "| SonarCloud    | ⏸️ Planned — next phase |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Fail if build-and-test failed
        if: needs.build-and-test.result == 'failure'
        run: |
          echo "::error::Build & Test job FAILED. Check logs above."
          exit 1
