# ============================================================
# Reusable Workflow — Docker Build & Push
#
# Builds one image per deployable via a MATRIX (parallel):
#   - farm-kart-app     (merged monolith, :8080)
#   - farm-kart-notification (:8087)
#   - farm-kart-agent   (:8091)
#
# Tagging strategy (docker/metadata-action):
#   - sha-<short-sha>   → every build (immutable, used for deploy + rollback)
#   - <branch>          → branch builds (develop, main)
#   - latest            → only on the default branch (main)
#   - v1.2.3 / 1.2     → on git tags (semver releases)
#
# On pull requests images are built but NOT pushed — this
# validates the Dockerfile without polluting the registry.
#
# Registry: GHCR (ghcr.io) — uses the built-in GITHUB_TOKEN, no
# extra secret needed. Swap `registry`/username/password to use
# ECR / Docker Hub instead.
# ============================================================
name: Docker

on:
  workflow_call:
    inputs:
      push:
        description: "Push images to the registry (false on PRs)"
        type: boolean
        required: false
        default: false
    outputs:
      image-tag:
        description: "Immutable sha tag for deployments"
        value: ${{ jobs.docker.outputs.image-tag }}

permissions:
  contents: read
  packages: write   # push to GHCR

jobs:
  docker:
    name: "Image: ${{ matrix.image }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image-tag: sha-${{ github.sha }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: farm-kart-app
            dockerfile: microservice_boot/farm-kart/Dockerfile
          - image: farm-kart-notification
            dockerfile: microservice_boot/farm-kart-notification/Dockerfile
          - image: farm-kart-agent
            dockerfile: microservice_boot/farm-kart-agent/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # BuildKit + layer caching via GitHub Actions cache backend.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build ${{ inputs.push && 'and push ' || '' }}image
        uses: docker/build-push-action@v6
        with:
          # All Java code lives under microservice_boot/ — that's the
          # Maven reactor root, so it is the Docker build context too.
          context: microservice_boot
          file: ${{ matrix.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
