# ============================================================
# Reusable Workflow — Build & Package
#
# WHY reusable (workflow_call): the same compile/package logic
# is needed by PR checks, deployments, and Docker builds. One
# definition = no drift between pipelines.
#
# Responsibilities:
#   - Compile every Maven module (fail fast on compile errors)
#   - Package runnable Spring Boot jars
#   - Upload jars as workflow artifacts (consumed by docker.yml
#     and deploy workflows, and downloadable for debugging)
# ============================================================
name: Build

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: "Upload packaged jars as workflow artifacts"
        type: boolean
        required: false
        default: true
    outputs:
      artifact-name:
        description: "Name of the uploaded jar artifact"
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

env:
  MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"

jobs:
  build:
    name: Compile & Package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact-name: farm-kart-jars-${{ github.sha }}
    defaults:
      run:
        # All Java modules live under microservice_boot/ (Maven reactor root)
        working-directory: microservice_boot

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      # -DskipTests here on purpose: tests run in test.yml in a
      # parallel job. Splitting compile/test keeps PR feedback fast
      # and lets a compile failure short-circuit everything else.
      - name: Compile & package all modules
        run: >
          mvn clean package
          --batch-mode --no-transfer-progress
          -DskipTests

      - name: Upload runnable jars
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: farm-kart-jars-${{ github.sha }}
          # Only the 3 deployables produce runnable Spring Boot jars
          # (artifact paths are workspace-relative, hence the prefix)
          path: |
            microservice_boot/marketplace/marketplace-rest/target/marketplace-rest-*.jar
            microservice_boot/notification/notification-rest/target/notification-rest-*.jar
            microservice_boot/agent/agent-rest/target/agent-rest-*.jar
            microservice_boot/discovery-service/discovery-service-rest/target/discovery-service-rest-*.jar
            microservice_boot/api-gateway/api-gateway-rest/target/api-gateway-rest-*.jar
            !**/original-*.jar
          retention-days: 14
          if-no-files-found: error
