server:
  port: 8082
  servlet:
    context-path: /buyer-service

spring:
  application:
    name: buyer-service
  datasource:
    url: ${BUYER_DB_URL:jdbc:mysql://localhost:3306/farmkart_buyer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${BUYER_DB_USER:farmkart}
    password: ${BUYER_DB_PASS:farmkart}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration/buyer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
