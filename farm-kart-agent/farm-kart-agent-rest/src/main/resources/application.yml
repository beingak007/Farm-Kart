server:
  port: 8091
  servlet:
    context-path: /agent-service

spring:
  application:
    name: farm-kart-agent

  datasource:
    url: ${AGENT_DB_URL:jdbc:mysql://localhost:3306/farmkart_agent?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${AGENT_DB_USER:root}
    password: ${AGENT_DB_PASS:root}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration/agent

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: agent-service
      auto-offset-reset: earliest

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

farmkart:
  agent:
    llm:
      provider: ${LLM_PROVIDER:openai}
      openai:
        api-key: ${OPENAI_API_KEY:}
        model: ${OPENAI_MODEL:gpt-4o-mini}
        max-tokens: 2048
  services:
    farmer-url:      ${FARMER_URL:http://localhost:8081/farmer-service}
    buyer-url:       ${BUYER_URL:http://localhost:8082/buyer-service}
    logistics-url:   ${LOGISTICS_URL:http://localhost:8083/logistics-service}
    warehouse-url:   ${WAREHOUSE_URL:http://localhost:8084/warehouse-service}
    market-price-url: ${MARKET_PRICE_URL:http://localhost:8085/market-price-service}
    catalog-url:     ${CATALOG_URL:http://localhost:8088/catalog-service}
    ai-advisory-url: ${AI_ADVISORY_URL:http://localhost:8090/ai-advisory-service}
    reporting-url:   ${REPORTING_URL:http://localhost:8089/reporting-service}
