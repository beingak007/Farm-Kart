server:
  port: 8091
  servlet:
    context-path: /agent-service

spring:
  application:
    name: farm-kart-agent

  datasource:
    url: ${AGENT_DB_URL:jdbc:mysql://localhost:3306/farmkart_agent?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${AGENT_DB_USER:root}
    password: ${AGENT_DB_PASS:root}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration/agent

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: agent-service
      auto-offset-reset: earliest

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

farmkart:
  agent:
    llm:
      provider: ${LLM_PROVIDER:openai}
      openai:
        api-key: ${OPENAI_API_KEY:}
        model: ${OPENAI_MODEL:gpt-4o-mini}
        max-tokens: 2048
  # All domain APIs now live in the single Farm Kart app (port 8080)
  services:
    farmer-url:      ${FARMKART_APP_URL:http://localhost:8080/farm-kart}
    buyer-url:       ${FARMKART_APP_URL:http://localhost:8080/farm-kart}
    logistics-url:   ${FARMKART_APP_URL:http://localhost:8080/farm-kart}
    warehouse-url:   ${FARMKART_APP_URL:http://localhost:8080/farm-kart}
    market-price-url: ${FARMKART_APP_URL:http://localhost:8080/farm-kart}
    catalog-url:     ${FARMKART_APP_URL:http://localhost:8080/farm-kart}
    ai-advisory-url: ${FARMKART_APP_URL:http://localhost:8080/farm-kart}
    reporting-url:   ${FARMKART_APP_URL:http://localhost:8080/farm-kart}
