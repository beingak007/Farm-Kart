server:
  port: 8080
  servlet:
    context-path: /farm-kart

spring:
  application:
    name: farm-kart
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${MYSQL_DATASOURCE_URL:jdbc:mysql://localhost:3306/farmkart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_DATASOURCE_USERNAME:farmkart}
    password: ${MYSQL_DATASOURCE_PASSWORD:farmkart}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      minimum-idle: 2
      maximum-pool-size: 10
  framework-datasource:
    url: ${POSTGRES_DATASOURCE_URL:jdbc:postgresql://localhost:5432/farmkart_framework}
    username: ${POSTGRES_DATASOURCE_USERNAME:farmkart}
    password: ${POSTGRES_DATASOURCE_PASSWORD:farmkart}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      minimum-idle: 2
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:farmkart-backend}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.farmkart.*"

farmkart:
  upload:
    dir: ${SHEET_UPLOAD_DIR:./uploads/sheets}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-at-least-256-bits-secret-key-here}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  security:
    enabled: true
  otp:
    ttl-minutes: 5
    max-send-requests: 3
    send-rate-window-minutes: 15
    max-verify-attempts: 5
    lock-duration-minutes: 15
  sms:
    provider: ${SMS_PROVIDER:console}
    api-key: ${FAST2SMS_API_KEY:}
    sender-id: ${SMS_SENDER_ID:FARMKT}
  oauth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    microsoft-client-id: ${MICROSOFT_CLIENT_ID:}

  # AWS S3
  s3:
    region: ${AWS_REGION:ap-south-1}
    bucket: ${AWS_S3_BUCKET:farmkart-dev-uploads}
    presign-expiry-seconds: ${S3_PRESIGN_EXPIRY_SECONDS:604800}   # 7 days

  # Kafka topics & consumer group
  kafka:
    topics:
      sheet-uploaded: farmkart.sheet.uploaded
      media-uploaded: farmkart.media.uploaded
    consumer-group: ${KAFKA_CONSUMER_GROUP:farmkart-backend}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false
