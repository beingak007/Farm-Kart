spring:
  config:
    import: optional:classpath:config/application-prod-common.yml
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  framework-datasource:
    hikari:
      maximum-pool-size: 10
  jpa:
    show-sql: false
  kafka:
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:farmkart-backend}

farmkart:
  s3:
    bucket: ${AWS_S3_BUCKET:farmkart-prod-uploads}
    presign-expiry-seconds: ${S3_PRESIGN_EXPIRY_SECONDS:86400}
  kafka:
    consumer-group: ${KAFKA_CONSUMER_GROUP:farmkart-backend}
  jwt:
    secret: ${JWT_SECRET}
  sms:
    provider: ${SMS_PROVIDER:fast2sms}
