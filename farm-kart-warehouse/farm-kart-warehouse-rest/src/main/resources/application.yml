server:
  port: 8084
  servlet:
    context-path: /warehouse-service

spring:
  application:
    name: warehouse-service
  datasource:
    url: ${WAREHOUSE_DB_URL:jdbc:mysql://localhost:3306/farmkart_warehouse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${WAREHOUSE_DB_USER:farmkart}
    password: ${WAREHOUSE_DB_PASS:farmkart}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration/warehouse
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
