server:
  port: 8084
  servlet:
    context-path: /warehouse-service

spring:
  application:
    name: warehouse-service
  datasource:
    url: ${WAREHOUSE_DB_URL:jdbc:mysql://localhost:3306/farmkart_warehouse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${WAREHOUSE_DB_USER:farmkart}
    password: ${WAREHOUSE_DB_PASS:farmkart}
    driver-class-name: com.mysql.cj.jdbc.Driver
  warehouse-app-datasource:
    url: ${WAREHOUSE_APP_DB_URL:jdbc:postgresql://localhost:5432/farmkart_warehouse_app}
    username: ${WAREHOUSE_APP_DB_USER:farmkart}
    password: ${WAREHOUSE_APP_DB_PASS:farmkart}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 8
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration/warehouse
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

farmkart:
  s3:
    region: ${AWS_REGION:ap-south-1}
    bucket: ${AWS_S3_BUCKET:farmkart-dev-uploads}
    presign-expiry-seconds: ${S3_PRESIGN_EXPIRY_SECONDS:604800}
