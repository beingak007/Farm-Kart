server:
  port: 8087
  servlet:
    context-path: /notification-service

spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIF_DB_URL:jdbc:mysql://localhost:3306/farmkart_notification?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${NOTIF_DB_USER:farmkart}
    password: ${NOTIF_DB_PASS:farmkart}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration/notification
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.farmkart.*"
        spring.json.use.type.headers: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /notification-service/api-docs
  swagger-ui:
    path: /notification-service/swagger-ui.html

farmkart:
  otp:
    ttl-minutes: 5
  sms:
    provider: ${SMS_PROVIDER:console}
    api-key: ${FAST2SMS_API_KEY:}
    sender-id: ${SMS_SENDER_ID:FARMKT}
