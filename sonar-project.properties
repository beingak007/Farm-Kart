# ============================================================
# SonarCloud project configuration
#
# NOTE: For Maven projects the sonar-maven-plugin reads most
# settings from pom.xml (<properties> — sonar.organization,
# sonar.projectKey, exclusions, jacoco report paths). This file
# documents/pins the project-level settings and is used when the
# scanner is invoked outside Maven (e.g. SonarLint, CLI).
# Values here MUST stay in sync with the root pom.xml.
# ============================================================

sonar.host.url=https://sonarcloud.io
sonar.organization=beingakstyle
sonar.projectKey=beingakstyle_farm-kart-microservice
sonar.projectName=Farm Kart Microservices

# Java 21 sources
sonar.java.source=21
sonar.java.target=21
sonar.sourceEncoding=UTF-8

# Multi-module Maven — sources/binaries resolved by the Maven scanner.
# Coverage: JaCoCo XML produced by `mvn verify`.
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# Exclude generated/boilerplate code from analysis & coverage —
# keeps the 80% gate focused on real business logic.
sonar.exclusions=**/generated/**,**/*Application.java,**/*Config.java,**/*Configuration.java,**/dto/**,**/entity/**,**/model/**,**/exception/**,**/constant/**,**/mapper/**
sonar.coverage.exclusions=**/generated/**,**/*Application.java,**/*Config.java,**/*Configuration.java,**/dto/**,**/entity/**,**/model/**,**/exception/**,**/constant/**,**/mapper/**

# Quality Gate — the pipeline passes -Dsonar.qualitygate.wait=true,
# which blocks CI until SonarCloud evaluates the gate.
# Configure the gate itself in SonarCloud (Quality Gates):
#   Coverage on new code           >= 80%
#   Bugs                           == 0   (Reliability rating A)
#   Vulnerabilities                == 0   (Security rating A)
#   Security hotspots reviewed     == 100%
#   Duplicated lines on new code   <= 3%
