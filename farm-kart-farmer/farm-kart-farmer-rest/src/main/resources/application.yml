server:
  port: 8081
  servlet:
    context-path: /farmer-service

spring:
  application:
    name: farmer-service
  datasource:
    url: ${FARMER_DB_URL:jdbc:mysql://localhost:3306/farmkart_farmer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${FARMER_DB_USER:farmkart}
    password: ${FARMER_DB_PASS:farmkart}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration/farmer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /farmer-service/api-docs
  swagger-ui:
    path: /farmer-service/swagger-ui.html
