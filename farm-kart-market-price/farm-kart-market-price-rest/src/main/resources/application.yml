server:
  port: 8085
  servlet:
    context-path: /market-price-service

spring:
  application:
    name: market-price-service
  datasource:
    url: ${MARKET_PRICE_DB_URL:jdbc:mysql://localhost:3306/farmkart_market_price?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MARKET_PRICE_DB_USER:farmkart}
    password: ${MARKET_PRICE_DB_PASS:farmkart}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration/market_price
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
