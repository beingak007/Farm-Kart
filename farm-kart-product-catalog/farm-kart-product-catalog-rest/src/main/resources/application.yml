server:
  port: 8088
  servlet:
    context-path: /catalog-service

spring:
  application:
    name: product-catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:mysql://localhost:3306/farmkart_product_catalog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${CATALOG_DB_USER:farmkart}
    password: ${CATALOG_DB_PASS:farmkart}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration/product_catalog
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

farmkart:
  elasticsearch:
    host: ${ELASTICSEARCH_HOST:http://localhost:9200}
    crop-index: ${ELASTICSEARCH_CROP_INDEX:farmkart_crops}

# Optional Cassandra event store — see cassandra/migration/README.md
# spring.cassandra.contact-points: ${CASSANDRA_IP:localhost}
# cassandra.migration.keyspace-name: ${CATALOG_CASSANDRA_KEYSPACE:farmkart_catalog}
# cassandra.migration.script-location: /cassandra/migration

springdoc:
  api-docs:
    path: /catalog-service/api-docs
  swagger-ui:
    path: /catalog-service/swagger-ui.html
